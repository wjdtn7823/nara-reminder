services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nara
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d nara"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    # 운영 VM 은 GitHub Actions 가 빌드한 이미지를 받아 실행하고, 로컬은 build 로 직접 빌드한다
    image: ghcr.io/wjdtn7823/nara-reminder:latest
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nara
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/wjdtn7823/nara-reminder-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # 운영 .env 에 도메인을 넣으면 Caddy 가 HTTPS 인증서를 자동 발급한다. 로컬은 :80
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
