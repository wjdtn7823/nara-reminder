spring:
  application:
    name: nara-reminder-worker
  main:
    # WebFlux 는 나라장터 API 호출(WebClient)에만 쓴다. 웹 서버는 띄우지 않는다
    web-application-type: none
  flyway:
    # 스키마 마이그레이션은 api 가 맡는다
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nara}
    username: ${DB_USERNAME:nara}
    password: ${DB_PASSWORD:nara}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

nara:
  service-key: ${NARA_SERVICE_KEY}
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
  mail:
    from: ${MAIL_FROM}
  bid:
    poll-interval: PT5M
    overlap: 30m
    initial-lookback: 1h
    max-lookback: 7d
    alert-after-failures: 6
  pre-spec:
    cron: "0 0 8 * * *"
    overlap: 1h
    initial-lookback: 24h
    max-lookback: 7d
    alert-after-failures: 1
